name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      # Preserve byte-for-byte hashes of three archived experiment helpers.
      - run: python -m ruff format --check --exclude scripts/exact_confirmation_counts.py,scripts/finalize_kl_80.py,scripts/recover_kl_brake.py .

  gym-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[rl,dev]"
      - run: python -m pytest

  replay-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm test
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
